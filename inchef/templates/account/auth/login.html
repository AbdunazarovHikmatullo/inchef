{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'account/css/auth.css' %}">
{% endblock head %}

{% block content %}
<main class="auth">
    <div class="auth-card">
        <h1 class="auth-title">Вход</h1>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Войти
            </button>
        </form>

        <p class="auth-footer">
            Нет аккаунта?
            <a href="{% url 'register' %}">Регистрация</a>
        </p>
    </div>
</main>
{% endblock content %}
