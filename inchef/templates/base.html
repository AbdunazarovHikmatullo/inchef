<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InChef</title>
  <link rel="stylesheet" href="{% static 'base.css' %}">
  {% block head %}
  {% endblock head %}
</head>

<body>
  <header>
    <div class="container flex justify-between items-center">
      <a class="text-title" href="{% url 'index' %}">InChef</a>
      <nav>
        <a href="{% url 'index' %}" class="link text-foreground ml-10">Главная</a>
        <a href="{% url 'products' %}" class="link text-foreground ml-10">Каталог</a>
        {% if user.is_authenticated %}
        <a href="{% url 'cart' %}" class="link text-foreground ml-10 cart-link">🛒</a>
        <a href="{% url 'profile' request.user.username %}" class="user-avatar">
          {{request.user.username|first|upper}}
        </a>
        {% else %}
        <a href="{% url 'login' %}" class="link text-foreground ml-10">Логин</a>
        {% endif %}
      </nav>
    </div>
  </header>

  {% block content %}
  {% endblock content %}


  {% block scripts %}
  {% endblock %}
</body>

</html>
